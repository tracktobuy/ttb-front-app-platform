services:
  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ttb-front-service
    restart: unless-stopped
    ports:
      - "3000:3000"        # host:container -- change container port to match your app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3